[package]
autoexamples = false
categories = [ "parser-implementations", "parsing", "text-editors" ]
description = "HSPICE netlist grammar for tree-sitter"
edition = "2024"
keywords = [ "incremental", "parsing", "tree-sitter", "hspice" ]
license = "MIT"
name = "tree-sitter-hspice"
repository = "https://github.com/Benedicit/HSPICE-lsp"
version = "0.1.0"

build = "bindings/rust/build.rs"
include = [ "bindings/rust/*", "grammar.js", "src/*", "tree-sitter.json" ]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.27.1"
